name: 回饋
description: 提交問題或建議
labels: []
body:
  - type: markdown
    attributes:
      value: |
        感謝回饋。小海底是個人維護的開源專案，描述越具體越容易定位問題。
        除非你明確同意，任何存檔內容都不要貼進 issue——只需要描述現象。
  - type: dropdown
    id: category
    attributes:
      label: 分類
      options:
        - bug（功能異常）
        - sound（背景音）
        - growth（成長與圖鑑）
        - stats（回顧面板）
        - backup（存檔與備份）
        - other（其他）
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: 系統資訊
      placeholder: "macOS 版本 / 晶片 / 小海底版本，如 macOS 15 / Apple M2 / v0.4.0"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 復現步驟
      placeholder: 一步步描述你做了什麼、發生了什麼
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望的行為
      placeholder: 你原本期待發生什麼
    validations:
      required: false
  - type: textarea
    id: extra
    attributes:
      label: 補充資訊（可選）
      placeholder: 截圖、控制檯輸出等
    validations:
      required: false
