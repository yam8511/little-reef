name: Release

# Pushing a tag such as v0.5.0 builds the Windows apps, signs their updates
# and uploads them to a draft release, which you review and publish as the
# latest: installed apps then update to it (see docs/releasing.md).
on:
  push:
    tags: ["v*"]

permissions:
  contents: write # the draft release, and the uploads to it

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  draft-release:
    name: Draft release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check the tag matches mygo.json
        run: |
          want="v$(jq -r .version mygo.json)"
          if [ "$GITHUB_REF_NAME" != "$want" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match mygo.json version ($want)"
            exit 1
          fi
      - name: Check CHANGELOG.md has the version's section
        run: |
          version="$(jq -r .version mygo.json)"
          grep -Eq "^## \[?${version//./\\.}\]?( |$)" CHANGELOG.md || {
            echo "::error::CHANGELOG.md has no '## $version' section, which the update window shows"
            exit 1
          }
      - name: Check the signing key is set
        env:
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
        run: |
          if [ -z "$MYGO_UPDATER_PRIVATE_KEY" ]; then
            echo "::error::add the MYGO_UPDATER_PRIVATE_KEY secret (the contents of mygo-update.key)"
            exit 1
          fi
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --draft --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
          fi

  build:
    name: Windows (${{ matrix.arch }})
    needs: draft-release
    # MyGo needs no cgo, so Ubuntu builds the Windows apps; NSIS makes the installers.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    env:
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install NSIS, for the Windows installers
        run: sudo apt-get update && sudo apt-get install -y nsis
      - name: Build and upload
        env:
          GH_TOKEN: ${{ github.token }}
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
        run: go tool mygo build -platform "windows/${{ matrix.arch }}" -upload .
