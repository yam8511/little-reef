name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  go:
    name: Go (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
    env:
      CGO_ENABLED: '0'
    steps:
      - name: Preserve repository line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Check formatting
        run: test -z "$(git ls-files -z '*.go' | xargs -0 gofmt -l)"
      - name: Vet
        run: go vet ./...
      - name: Vet the MCP harness
        run: go vet -tags harness ./...
      - name: Test
        run: go test -count=1 -timeout=10m ./...
      - name: MyGo vet
        run: go tool mygo vet .
      - name: Build desktop (Windows amd64 and arm64)
        run: |
          for arch in amd64 arm64; do
            GOARCH="$arch" go build -o "$RUNNER_TEMP/little-reef-$arch.exe" .
          done
